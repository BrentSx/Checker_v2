{% extends "base.html" %}
{% block title %}Logs — Snickerdoodle Checker{% endblock %}

{% block content %}
<div x-data="logsApp()" x-init="init()">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-white">Logs</h2>
        <div class="flex gap-2">
            <button @click="autoScroll = !autoScroll" class="btn btn-sm"
                    :class="autoScroll ? 'btn-primary' : 'btn-ghost'" x-text="autoScroll ? '⬇ Auto-scroll ON' : '⬇ Auto-scroll OFF'"></button>
            {% if user.role in ['admin', 'operator'] %}
            <button @click="clearLogs()" class="btn btn-sm btn-danger">Clear</button>
            {% endif %}
            {% if user.role == 'admin' %}
            <a href="/api/logs/download" class="btn btn-sm btn-ghost">Download</a>
            {% endif %}
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-4">
        <div class="flex flex-wrap gap-3 items-center">
            <div>
                <label class="input-label">Level</label>
                <select x-model="filter.level" @change="fetchLogs()" class="input w-32">
                    <option value="">All</option>
                    <option value="DEBUG">DEBUG</option>
                    <option value="INFO">INFO</option>
                    <option value="WARNING">WARNING</option>
                    <option value="ERROR">ERROR</option>
                </select>
            </div>
            <div>
                <label class="input-label">Component</label>
                <select x-model="filter.component" @change="fetchLogs()" class="input w-40">
                    <option value="">All</option>
                    <template x-for="c in components" :key="c">
                        <option :value="c" x-text="c"></option>
                    </template>
                </select>
            </div>
            <div class="flex-1">
                <label class="input-label">Search</label>
                <input type="text" x-model.debounce.300ms="filter.search" @input="fetchLogs()"
                       class="input" placeholder="Search logs...">
            </div>
        </div>
    </div>

    <!-- Log Viewer -->
    <div class="card p-0">
        <div class="bg-dark-200 rounded-xl overflow-hidden">
            <div class="max-h-[600px] overflow-y-auto font-mono text-xs" x-ref="logContainer">
                <template x-for="(entry, i) in logs" :key="i">
                    <div class="log-entry flex gap-2 border-b border-dark-300/50 py-1 px-3">
                        <span class="timestamp text-gray-600 whitespace-nowrap" x-text="entry.timestamp?.substring(11, 19) || ''"></span>
                        <span class="whitespace-nowrap font-bold" :class="'level-' + entry.level" x-text="'[' + entry.level + ']'"></span>
                        <span class="component text-blue-400 whitespace-nowrap" x-text="'[' + entry.component + ']'"></span>
                        <span class="text-yellow-400 whitespace-nowrap" x-show="entry.job_id" x-text="entry.job_id ? '[' + entry.job_id.substring(0,8) + ']' : ''"></span>
                        <span class="message text-gray-300 break-all" x-text="entry.message"></span>
                    </div>
                </template>
                <div x-show="logs.length === 0" class="text-center text-gray-600 py-8">No log entries</div>
            </div>
        </div>
        <div class="p-3 border-t border-dark-300 flex items-center justify-between">
            <span class="text-xs text-gray-500" x-text="logs.length + ' entries'"></span>
            <div class="flex gap-1">
                <span class="badge badge-blue" x-text="liveLogs + ' live'"></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function logsApp() {
    return {
        logs: [],
        components: [],
        filter: { level: '', component: '', search: '' },
        autoScroll: true,
        liveLogs: 0,

        async init() {
            await this.fetchLogs();
            await this.fetchComponents();

            ws.on('log', (entry) => {
                this.liveLogs++;
                if (this.matchesFilter(entry)) {
                    this.logs.push(entry);
                    if (this.logs.length > 2000) this.logs.splice(0, 500);
                    if (this.autoScroll) {
                        this.$nextTick(() => {
                            const c = this.$refs.logContainer;
                            if (c) c.scrollTop = c.scrollHeight;
                        });
                    }
                }
            });
        },

        async fetchLogs() {
            try {
                const params = new URLSearchParams();
                if (this.filter.level) params.set('level', this.filter.level);
                if (this.filter.component) params.set('component', this.filter.component);
                if (this.filter.search) params.set('search', this.filter.search);
                params.set('limit', '500');

                this.logs = await api(`/api/logs/?${params}`);
                if (this.autoScroll) {
                    this.$nextTick(() => {
                        const c = this.$refs.logContainer;
                        if (c) c.scrollTop = c.scrollHeight;
                    });
                }
            } catch (e) {}
        },

        async fetchComponents() {
            try { this.components = await api('/api/logs/components'); } catch(e) {}
        },

        async clearLogs() {
            if (await confirmAction('Clear Logs', 'Clear all in-memory logs?')) {
                await api('/api/logs/clear', { method: 'POST' });
                this.logs = [];
                showToast('Logs cleared', 'info');
            }
        },

        matchesFilter(entry) {
            if (this.filter.level && entry.level !== this.filter.level) return false;
            if (this.filter.component && entry.component.toLowerCase() !== this.filter.component.toLowerCase()) return false;
            if (this.filter.search && !entry.message.toLowerCase().includes(this.filter.search.toLowerCase())) return false;
            return true;
        },
    };
}
</script>
{% endblock %}
